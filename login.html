<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link href="https://googleapis.com" rel="stylesheet">
     <link rel="stylesheet" href="https://cloudflare.com">
    <title>Flow Work - Login</title>
</head>
<body>
    <div class="login-container">

     <div class="vector-puple"></div>
     <div class="vector-green"></div>


    < class="login-card">

    <header class="card-header">
     <div class="logo">
        <span class="logo-icon">🔗</span>
        <span class="logo-text">Flow<span>Work</span></span>
     </div>

     <h2>Bem-Vindo de volta,</h2>
     <p>Acesse sua conta para começar.</p>

    </header>

   <form class="login-form">
     <div class="input-group">
     <i class="fa-regular fa-envelope input-icon"></i>
     <input type="email" placeholder="email" required>
     </div>

    
     <div class="input-group">
       <i class="fa-solid fa-lock input-icon"></i>
       <input type="password" placeholder="senha" id="password" required>
       <i class="fa-regular fa-eye-slash toggle-password"></i>
     </div>

     <div class="form-options">
        <label class="checkbox-container">
            <input type="checkbox">
            <span class="checkmark"></span>
           Lembrar de mim
        </label>
       <a href="#" class="forgot-link">Esqueceu a senha?</a>
     </div>

     
     <button type="submit" class="btn-submit">Entrar</button>
   </form>

     <div class="divider">
     <span>OR</span>
     </div>

      <div class="social-login">
        <button class="btn-social">
         <img src="https://wikimedia.org" alt="Google">Google
        </button>

        <button class="btn-social">
          <img src="https://wikimedia.org" alt="Microsoft">Microsoft
        </button>


        <button class="btn-social">
          <img src="https://wikimedia.org" alt="Apple" style="filter: invert(1);"> Apple
        </button>

      </div>


      <footer class="card-footer">
        <a href="#">Criar uma conta</a>
        <span class="bullet">•</span>
        <a href>Política de privacidade</a>
      </footer>

    </main>

    </div>

</body>
</html>
